name: Deploy web

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
  workflow_dispatch: {}

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: ghcr.io/asharksfishbowl/dealsniper-web:latest
