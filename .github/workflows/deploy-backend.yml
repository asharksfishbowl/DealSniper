name: Deploy backend

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/asharksfishbowl/dealsniper-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Trigger Azure redeploy
        # Azure Web App for Containers doesn't auto-pull a new "latest"
        # image on its own -- this hits the site's docker CD webhook
        # (Kudu publish credentials, not the ARM API) so it pulls and
        # restarts with the image just pushed above.
        run: |
          curl -fsS -X POST \
            -u "${{ secrets.AZURE_API_KUDU_USER }}:${{ secrets.AZURE_API_KUDU_PASS }}" \
            https://dealsniper-api.scm.azurewebsites.net/docker/hook
