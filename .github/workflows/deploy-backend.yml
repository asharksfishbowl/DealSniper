name: Deploy backend

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/asharksfishbowl/dealsniper-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Trigger Azure redeploy
        # Azure Web App for Containers doesn't auto-pull a new "latest"
        # image on its own -- this hits the site's docker CD webhook
        # (Kudu publish credentials, not the ARM API) so it pulls and
        # restarts with the image just pushed above.
        #
        # Credentials go through env:, NOT ${{ }} interpolated directly
        # into the quoted -u string -- the Kudu username is literally
        # "$dealsniper-api" (a leading $), and ${{ }} does raw text
        # substitution before bash parses the line, so bash would then
        # try to expand "$dealsniper" as an (undefined, empty) shell
        # variable inside the double quotes, mangling the username.
        # Referencing an already-set env var's contents doesn't trigger
        # that re-expansion.
        run: |
          curl -fsS -X POST \
            -u "${AZURE_API_KUDU_USER}:${AZURE_API_KUDU_PASS}" \
            https://dealsniper-api.scm.azurewebsites.net/docker/hook
        env:
          AZURE_API_KUDU_USER: ${{ secrets.AZURE_API_KUDU_USER }}
          AZURE_API_KUDU_PASS: ${{ secrets.AZURE_API_KUDU_PASS }}
