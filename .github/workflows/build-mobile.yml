name: Build mobile

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options: [development, preview, production]
        default: preview

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm ci

      - name: Queue EAS build
        # "eas" is the CLI's binary name, but the npm package is "eas-cli" --
        # bare `npx eas` can't resolve that mismatch and fails with
        # "could not determine executable to run". Must invoke via the
        # actual package name.
        run: npx --yes eas-cli build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
